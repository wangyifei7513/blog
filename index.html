<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="风易——王逸飞的个人诗集。">
  <meta name="theme-color" content="#ffffff">

  <script>
  (function () {
      const theme = localStorage.getItem("fengyi-theme");
      if (theme === "dark") {
          document.documentElement.dataset.theme = "dark";
      } else {
          document.documentElement.dataset.theme = "light";
      }
  })();
  </script>
  <title>风易</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
  html,
  body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
  }

  body {
      background: var(--bg);
      color: var(--text);
  }

  .index-container {
      width: 100%;
      height: 100dvh;
      box-sizing: border-box;
      padding-top: 40vh;
      display: flex;
      flex-direction: column;
      align-items: center;
  }

  .index-logo {
      font-size: clamp(7rem, 24vw, 20rem);
      line-height: 0.9;
      font-weight: 700;
      letter-spacing: -0.08em;
      text-decoration: none;
      color: var(--text);
      transition: color 180ms ease;
  }

  .index-logo:hover {
      color: var(--accent);
  }

  .index-line {
      width: min(160px, 30vw);
      height: 2px;
      margin: 32px 0 24px;
      background: var(--accent);
  }

  .index-nav {
      display: flex;
      gap: 32px;
  }

  .index-nav a {
      color: var(--text);
      text-decoration: none;
      font-size: 1rem;
      transition: color 180ms ease;
  }

  .index-nav a:hover {
      color: var(--accent);
  }

  </style>

</head>

<body>
  <main class="index-container">
    <a class="index-logo" href="posts.html" aria-label="进入诗集">
      風易
    </a>
    
    <div class="index-line" aria-hidden="true"></div>
    <nav class="index-nav" aria-label="首页导航">
      <a href="posts.html">詩集</a>
      <a href="category.html">分類</a>
      <a href="about.html">關於</a>
    </nav>
  </main>

  <script src="js/main.js"></script>
  
</body>

</html>
