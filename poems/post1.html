<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="《秋夜》——风易诗集。">
  <title>秋夜 · 风易</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-base="../">
  <div id="site-header"></div>

  <main class="page poem-page">
    <article class="poem">
      <header class="poem-heading">
        <p class="eyebrow">2026.09.20 · 七绝</p>
        <h1>秋夜</h1>
      </header>

      <div class="poem-body">
        <p>月落寒江静，</p>
        <p>风吹客梦长。</p>
        <p>一灯临夜色，</p>
        <p>独坐听秋凉。</p>
      </div>

      <footer class="poem-meta">
        <span>分类：七绝</span>
        <span>标签：秋 · 月 · 夜</span>
      </footer>
    </article>
  </main>

  <div id="site-footer"></div>
  <script src="../js/main.js"></script>
</body>
</html>
