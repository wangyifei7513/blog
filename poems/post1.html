  <main class="page poem-page">
    <article class="poem">
      <header class="poem-heading">
        <p class="eyebrow">2026.09.20 · 七绝</p>
        <h1>秋夜</h1>
      </header>

      <div class="poem-body">
        <p>月落寒江静，</p>
        <p>风吹客梦长。</p>
        <p>一灯临夜色，</p>
        <p>独坐听秋凉。</p>
      </div>

      <footer class="poem-meta">
        <span>分类：七绝</span>
        <span>标签：秋 · 月 · 夜</span>
      </footer>
    </article>
