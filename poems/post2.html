  <title>风 · 风易</title>

<body data-base="../">
  <div id="site-header"></div>

  <main class="page poem-page">
    <article class="poem">
      <header class="poem-heading">
        <p class="eyebrow">2026.08.31 · 现代诗</p>
        <h1>风</h1>
      </header>

      <div class="poem-body">
        <p>风从很远的地方来，</p>
        <p>经过窗前，</p>
        <p>没有留下姓名。</p>
      </div>

      <footer class="poem-meta">
        <span>分类：现代诗</span>
        <span>标签：风 · 时间</span>
      </footer>
    </article>
